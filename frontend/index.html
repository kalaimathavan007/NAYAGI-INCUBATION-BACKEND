<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nayagi Incubation Council - Portal Access</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">

    <!-- 100% SELF-CONTAINED ICONIC CSS LAYOUT -->
    <style>
        :root {
            --bg-dark: #070a13;
            --card-bg: rgba(13, 18, 30, 0.88);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --secondary: #0ea5e9;
            --accent-gold: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-glass: rgba(255, 255, 255, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.25rem;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Glowing Background Orbs */
        .ambient-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            pointer-events: none;
            z-index: 1;
            opacity: 0.5;
        }
        .orb-1 {
            top: -10%;
            left: -10%;
            width: 420px;
            height: 420px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.5), rgba(14, 165, 233, 0.15));
            animation: orbFloat1 16s ease-in-out infinite alternate;
        }
        .orb-2 {
            bottom: -10%;
            right: -10%;
            width: 480px;
            height: 480px;
            background: radial-gradient(circle, rgba(245, 158, 11, 0.4), rgba(236, 72, 153, 0.2));
            animation: orbFloat2 20s ease-in-out infinite alternate;
        }

        @keyframes orbFloat1 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(60px, 80px) scale(1.15); }
        }
        @keyframes orbFloat2 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-70px, -60px) scale(1.1); }
        }

        /* ICONIC GLASS CARD CONTAINER */
        .iconic-card {
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7),
                        0 0 40px rgba(99, 102, 241, 0.18);
            width: 100%;
            max-width: 460px;
            padding: 2.25rem 2rem;
            margin: auto;
            position: relative;
            z-index: 10;
            animation: cardEntrance 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: translateY(25px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Exact Uploaded Peacock Logo Display */
        .uploaded-logo-container {
            width: 100%;
            max-width: 280px;
            margin: 0 auto 0.75rem auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .uploaded-logo-img {
            width: 100%;
            height: auto;
            max-height: 220px;
            object-fit: contain;
            filter: drop-shadow(0 0 16px rgba(245, 158, 11, 0.35));
            animation: logoFloat 3s ease-in-out infinite alternate;
        }

        @keyframes logoFloat {
            0% { transform: translateY(0) scale(0.98); }
            100% { transform: translateY(-4px) scale(1.02); filter: drop-shadow(0 0 24px rgba(245, 158, 11, 0.6)); }
        }

        /* Auth Tabs */
        .tab-switcher {
            display: flex;
            background: rgba(15, 23, 42, 0.9);
            padding: 0.3rem;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin: 1.25rem 0 1.5rem 0;
        }

        .tab-btn {
            flex: 1;
            padding: 0.65rem 0.5rem;
            font-size: 0.8rem;
            font-weight: 700;
            border-radius: 10px;
            border: none;
            color: #94a3b8;
            background: transparent;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
        }

        /* Form Inputs */
        .form-field {
            margin-bottom: 1.1rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .field-label {
            font-size: 0.725rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #cbd5e1;
        }

        .input-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-box i {
            position: absolute;
            left: 1rem;
            color: #64748b;
            font-size: 0.85rem;
            transition: color 0.2s ease;
        }

        .form-input {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            border-radius: 12px;
            padding: 0.75rem 1rem 0.75rem 2.6rem;
            font-size: 0.875rem;
            width: 100%;
            outline: none;
            transition: all 0.25s ease;
        }

        .form-input:focus {
            border-color: #818cf8;
            box-shadow: 0 0 0 3.5px rgba(99, 102, 241, 0.28);
            background: rgba(15, 23, 42, 0.98);
        }

        .form-input:focus + i,
        .input-box:focus-within i {
            color: #818cf8;
        }

        select.form-input option {
            background-color: #0f172a;
            color: #ffffff;
        }

        textarea.form-input {
            resize: vertical;
        }

        /* Glowing Submit Buttons */
        .btn-action-primary {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: #ffffff;
            font-size: 0.875rem;
            font-weight: 700;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1.25rem;
        }

        .btn-action-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.55);
        }

        .btn-action-secondary {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, #0284c7, #0ea5e9);
            color: #ffffff;
            font-size: 0.875rem;
            font-weight: 700;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 6px 20px rgba(14, 165, 233, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1.25rem;
        }

        .btn-action-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(14, 165, 233, 0.55);
        }

        /* Splash Overlay */
        #splash-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #070a13;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .splash-progress-bar {
            width: 140px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
            margin-top: 1.5rem;
        }

        .splash-progress-fill {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            width: 0%;
            background: linear-gradient(90deg, #38bdf8, #818cf8, #f59e0b);
            animation: fillProgress 1.1s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes fillProgress {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        /* Alert Box */
        .notify-alert {
            padding: 0.75rem 1rem;
            border-radius: 12px;
            font-size: 0.8rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .notify-alert.error {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        .notify-alert.success {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .hidden {
            display: none !important;
        }

        .flex-2 {
            display: flex;
            gap: 0.75rem;
        }

        .flex-2 > div {
            flex: 1;
        }

        @media (max-width: 640px) {
            .flex-2 {
                flex-direction: column;
                gap: 0;
            }
            .iconic-card {
                padding: 1.75rem 1.25rem;
            }
        }
    </style>
</head>
<body>

    <!-- Ambient Glowing Orbs -->
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>

    <!-- Splash Screen Animation -->
    <div id="splash-overlay">
        <div style="text-align: center; padding: 1rem;">
            <div class="uploaded-logo-container">
                <img src="/logo.svg" alt="Nayagi Logo" class="uploaded-logo-img">
            </div>
            <div class="splash-progress-bar">
                <div class="splash-progress-fill"></div>
            </div>
        </div>
    </div>

    <!-- MAIN ICONIC CARD -->
    <div class="iconic-card">

        <!-- Exact Uploaded Peacock Logo Image Display -->
        <div class="uploaded-logo-container">
            <img src="/logo.svg" alt="Nayagi Logo" class="uploaded-logo-img">
        </div>

        <!-- Auth Switch Tabs -->
        <div class="tab-switcher">
            <button id="tab-login" type="button" onclick="switchAuthTab('login')" class="tab-btn active">
                <i class="fa-solid fa-right-to-bracket"></i> Sign In
            </button>
            <button id="tab-register" type="button" onclick="switchAuthTab('register')" class="tab-btn">
                <i class="fa-solid fa-user-plus"></i> Register Startup Team
            </button>
        </div>

        <!-- Alert Notification Box -->
        <div id="auth-alert" class="notify-alert error hidden"></div>

        <!-- 1. LOGIN FORM (Starts 100% EMPTY by default) -->
        <form id="form-login" onsubmit="handleLogin(event)" autocomplete="off">
            <div class="form-field">
                <label for="login-email" class="field-label">Email Address</label>
                <div class="input-box">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="login-email" required value="" autocomplete="off" inputmode="email" class="form-input" placeholder="Enter registered email">
                </div>
            </div>

            <div class="form-field">
                <label for="login-password" class="field-label">Password</label>
                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="login-password" required value="" autocomplete="new-password" class="form-input" placeholder="••••••••">
                </div>
            </div>

            <button type="submit" id="btn-login-submit" class="btn-action-primary">
                <span>Sign In to Dashboard</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <!-- 2. REGISTER TEAM FORM -->
        <form id="form-register" onsubmit="handleRegister(event)" class="hidden" autocomplete="off">

            <div class="flex-2">
                <div class="form-field">
                    <label for="reg-name" class="field-label">Founder Full Name *</label>
                    <div class="input-box">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="reg-name" required value="" autocomplete="off" class="form-input" placeholder="Full Name">
                    </div>
                </div>

                <div class="form-field">
                    <label for="reg-email" class="field-label">Email Address *</label>
                    <div class="input-box">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="reg-email" required value="" autocomplete="off" inputmode="email" class="form-input" placeholder="founder@startup.com">
                    </div>
                </div>
            </div>

            <div class="form-field">
                <label for="reg-team" class="field-label">Team / Startup Name *</label>
                <div class="input-box">
                    <i class="fa-solid fa-people-group"></i>
                    <input type="text" id="reg-team" required value="" autocomplete="off" class="form-input" placeholder="e.g. NextGen Robotics">
                </div>
            </div>

            <div class="flex-2">
                <div class="form-field">
                    <label for="reg-idea" class="field-label">Startup Idea Title *</label>
                    <input type="text" id="reg-idea" required value="" autocomplete="off" class="form-input" style="padding-left: 1rem;" placeholder="e.g. Smart Drone">
                </div>

                <div class="form-field">
                    <label for="reg-domain" class="field-label">Domain / Sector *</label>
                    <select id="reg-domain" required onchange="toggleOtherDomain('reg-domain', 'reg-domain-other-container')" class="form-input" style="padding-left: 1rem;">
                        <option value="General Software">General Software</option>
                        <option value="AgriTech">AgriTech</option>
                        <option value="AI & Robotics">AI & Robotics</option>
                        <option value="IoT">IoT & Hardware</option>
                        <option value="HealthTech">HealthTech</option>
                        <option value="EdTech">EdTech</option>
                        <option value="FinTech">FinTech</option>
                        <option value="CleanTech & Energy">CleanTech & Energy</option>
                        <option value="Other">Other (Custom Domain)</option>
                    </select>

                    <div id="reg-domain-other-container" class="hidden" style="margin-top: 0.5rem;">
                        <label for="reg-domain-other" class="sr-only">Custom Domain</label>
                        <input type="text" id="reg-domain-other" value="" autocomplete="off" placeholder="Type custom domain..." class="form-input" style="padding-left: 1rem;">
                    </div>
                </div>
            </div>

            <div class="form-field">
                <label for="reg-desc" class="field-label">Brief Description</label>
                <textarea id="reg-desc" rows="2" class="form-input" style="padding-left: 1rem;" placeholder="Brief summary of startup idea..."></textarea>
            </div>

            <div class="form-field">
                <label for="reg-password" class="field-label">Password *</label>
                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="reg-password" required value="" autocomplete="new-password" class="form-input" placeholder="Minimum 6 characters">
                </div>
            </div>

            <button type="submit" id="btn-reg-submit" class="btn-action-secondary">
                <span>Register Team & Access Workspace</span>
                <i class="fa-solid fa-user-check"></i>
            </button>
        </form>

    </div>

    <!-- Javascript Controller -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Guarantee inputs start 100% EMPTY without pre-filled values
            const loginEmail = document.getElementById("login-email");
            const loginPass = document.getElementById("login-password");
            if (loginEmail) loginEmail.value = "";
            if (loginPass) loginPass.value = "";

            // Dismiss Splash Screen safely
            setTimeout(() => {
                const splash = document.getElementById("splash-overlay");
                if (splash) {
                    splash.style.opacity = "0";
                    setTimeout(() => { splash.style.display = "none"; }, 500);
                }
            }, 900);

            const token = localStorage.getItem("incubation_token");
            const role = localStorage.getItem("incubation_role");

            // Regular user auto-login
            if (token && role === "user") {
                window.location.href = "/dashboard.html";
            } else if (role === "admin") {
                localStorage.removeItem("incubation_token");
                localStorage.removeItem("incubation_role");
            }
        });

        function toggleOtherDomain(selectId, containerId) {
            const select = document.getElementById(selectId);
            const container = document.getElementById(containerId);
            if (select.value === "Other") {
                container.classList.remove("hidden");
            } else {
                container.classList.add("hidden");
            }
        }

        function switchAuthTab(tab) {
            const loginBtn = document.getElementById("tab-login");
            const regBtn = document.getElementById("tab-register");
            const loginForm = document.getElementById("form-login");
            const regForm = document.getElementById("form-register");
            const alertBox = document.getElementById("auth-alert");
            alertBox.classList.add("hidden");

            if (tab === "login") {
                loginBtn.classList.add("active");
                regBtn.classList.remove("active");
                loginForm.classList.remove("hidden");
                regForm.classList.add("hidden");
            } else {
                regBtn.classList.add("active");
                loginBtn.classList.remove("active");
                regForm.classList.remove("hidden");
                loginForm.classList.add("hidden");
            }
        }

        function showAlert(msg, isError = true) {
            const alertBox = document.getElementById("auth-alert");
            alertBox.classList.remove("hidden", "error", "success");

            if (isError) {
                alertBox.classList.add("error");
                alertBox.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> <span>${msg}</span>`;
            } else {
                alertBox.classList.add("success");
                alertBox.innerHTML = `<i class="fa-solid fa-circle-check"></i> <span>${msg}</span>`;
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById("login-email").value.trim();
            const password = document.getElementById("login-password").value;

            const submitBtn = document.getElementById("btn-login-submit");
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...`;

            try {
                const res = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();
                if (!res.ok) {
                    throw new Error(data.detail || "Login failed.");
                }

                localStorage.setItem("incubation_token", data.access_token);
                localStorage.setItem("incubation_role", data.role);
                localStorage.setItem("incubation_email", data.email);
                localStorage.setItem("incubation_name", data.full_name);
                localStorage.setItem("incubation_team_id", data.team_id || "");
                localStorage.setItem("incubation_team_name", data.team_name || "");

                showAlert("Login Successful! Redirecting...", false);
                setTimeout(() => {
                    if (data.role === "admin") {
                        window.location.href = "/admin.html";
                    } else {
                        window.location.href = "/dashboard.html";
                    }
                }, 500);

            } catch (err) {
                showAlert(err.message, true);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>Sign In to Dashboard</span> <i class="fa-solid fa-arrow-right"></i>`;
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const full_name = document.getElementById("reg-name").value.trim();
            const email = document.getElementById("reg-email").value.trim();
            const team_name = document.getElementById("reg-team").value.trim();
            const idea_title = document.getElementById("reg-idea").value.trim();

            let domain = document.getElementById("reg-domain").value;
            if (domain === "Other") {
                const customDomain = document.getElementById("reg-domain-other").value.trim();
                domain = customDomain || "Custom Domain";
            }

            const description = document.getElementById("reg-desc").value.trim();
            const password = document.getElementById("reg-password").value;

            const submitBtn = document.getElementById("btn-reg-submit");
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Registering Team...`;

            try {
                const res = await fetch("/api/auth/register", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ full_name, email, team_name, idea_title, domain, description, password })
                });

                const data = await res.json();
                if (!res.ok) {
                    throw new Error(data.detail || "Registration failed.");
                }

                localStorage.setItem("incubation_token", data.access_token);
                localStorage.setItem("incubation_role", data.role);
                localStorage.setItem("incubation_email", data.email);
                localStorage.setItem("incubation_name", data.full_name);
                localStorage.setItem("incubation_team_id", data.team_id || "");
                localStorage.setItem("incubation_team_name", data.team_name || "");

                showAlert("Team Registered Successfully! Redirecting to Workspace...", false);
                setTimeout(() => {
                    if (data.role === "admin") {
                        window.location.href = "/admin.html";
                    } else {
                        window.location.href = "/dashboard.html";
                    }
                }, 500);

            } catch (err) {
                showAlert(err.message, true);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>Register Team & Access Workspace</span> <i class="fa-solid fa-user-check"></i>`;
            }
        }
    </script>
</body>
</html>
